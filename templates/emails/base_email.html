<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block email_title %}Crystal AI Notification{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    table {
      border-collapse: collapse;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #f1f5f9;
      padding: 30px 0;
    }
    .main-card {
      background-color: #ffffff;
      margin: 0 auto;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 32px 36px;
      text-align: left;
      border-bottom: 3px solid #2563eb;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .brand-title span {
      color: #3b82f6;
    }
    .brand-slogan {
      font-size: 13px;
      color: #94a3b8;
      margin: 4px 0 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .content {
      padding: 36px 36px 28px;
      font-size: 15px;
      line-height: 1.6;
      color: #334155;
    }
    .btn-action {
      display: inline-block;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 8px;
      margin-top: 18px;
      margin-bottom: 8px;
    }
    .info-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #2563eb;
      border-radius: 6px;
      padding: 16px 20px;
      margin: 20px 0;
    }
    .info-row {
      margin: 6px 0;
      font-size: 14px;
    }
    .info-label {
      font-weight: 600;
      color: #64748b;
      display: inline-block;
      width: 120px;
    }
    .info-value {
      color: #0f172a;
      font-weight: 500;
    }
    .footer {
      background-color: #f8fafc;
      padding: 24px 36px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
    }
    .footer a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="main-card" align="center" cellpadding="0" cellspacing="0">
      <!-- Header -->
      <tr>
        <td class="header">
          <h1 class="brand-title">Teach<span>Live</span></h1>
          <p class="brand-slogan">Crystal AI — Smart Live Learning & Virtual Classroom.</p>
        </td>
      </tr>

      <!-- Body Content -->
      <tr>
        <td class="content">
          {% block email_content %}{% endblock %}
        </td>
      </tr>

      <!-- Footer -->
      <tr>
        <td class="footer">
          <p style="margin: 0 0 6px;">&copy; {% now "Y" %} Crystal AI Virtual Classroom Platform. All rights reserved.</p>
          <p style="margin: 0;">This is an automated notification from Crystal AI. Please do not reply directly to this email.</p>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
