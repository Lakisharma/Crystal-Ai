{% extends 'base.html' %}
{% load static %}

{% block title %}Bad Request (400) - TeachLive{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-warning mb-3">400</div>
    <h2 class="fw-bold mb-2">Invalid or Malformed Request</h2>
    <p class="text-secondary mb-4">The server could not understand the request due to invalid parameters or malformed syntax.</p>
    <a href="{% url 'core:home' %}" class="btn btn-primary-gradient px-4">
      <i class="bi bi-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
