{% extends 'base.html' %}
{% load static %}

{% block title %}Bad Request (400) — Crystal AI{% endblock %}

{% block meta_robots %}
<meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5 max-w-600 mx-auto">
    <div class="display-1 fw-bold text-warning mb-2">400</div>
    <h1 class="h2 fw-bold text-dark mb-2">Bad Request</h1>
    <p class="text-secondary mb-4 small">
      The request could not be understood by the server due to invalid parameters.
    </p>
    <a href="{% url 'core:home' %}" class="btn btn-primary px-4 fw-semibold shadow-sm">
      <i class="bi bi-house me-1"></i> Back to Home
    </a>
  </div>
</div>
{% endblock %}
